<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="UPAO S — Aplicación Android para estudiantes universitarios">
  <defs>
    <linearGradient id="bg-upaos" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b18"/>
      <stop offset="55%" stop-color="#0a162c"/>
      <stop offset="100%" stop-color="#0c1d3a"/>
    </linearGradient>
    <radialGradient id="glow-upaos" cx="0.72" cy="0.28" r="0.6">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="phone-bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid-upaos" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="600" fill="url(#bg-upaos)"/>
  <rect width="960" height="600" fill="url(#grid-upaos)"/>
  <rect width="960" height="600" fill="url(#glow-upaos)"/>

  <!-- Left editorial context -->
  <g font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif">
