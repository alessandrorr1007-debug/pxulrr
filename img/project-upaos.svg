    <rect x="10" y="10" width="248" height="488" rx="26" fill="#070d1a"/>
    <!-- Camera pill -->
    <rect x="104" y="20" width="60" height="8" rx="4" fill="#1e293b"/>

    <!-- Phone UI content -->
    <g transform="translate(24, 48)" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
      <text x="0" y="14" fill="#94a3b8" font-size="11">Ciclo 2026-1</text>
      <text x="0" y="34" fill="#f8fafc" font-size="18" font-weight="800">Hola, Alessandro</text>

