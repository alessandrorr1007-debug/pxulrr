      <text x="16" y="72" fill="#e0f2fe" font-size="11" font-weight="600">PROMEDIO PONDERADO</text>
      <text x="16" y="108" fill="#ffffff" font-size="32" font-weight="800" font-family="'JetBrains Mono', monospace">17.4</text>
