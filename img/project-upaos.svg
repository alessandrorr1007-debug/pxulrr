      <rect x="150" y="64" width="54" height="22" rx="6" fill="#030712" fill-opacity="0.25"/>
      <text x="177" y="79" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">6 cursos</text>
      <text x="16" y="128" fill="#e0f2fe" font-size="11">Calculadora de nota final activa</text>

      <!-- Today Schedule -->
      <text x="0" y="166" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="0.8">HOY · HORARIO</text>

      <rect x="0" y="178" width="220" height="62" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.35"/>
      <rect x="10" y="190" width="4" height="38" rx="2" fill="#38bdf8"/>
      <text x="24" y="204" fill="#f8fafc" font-size="13" font-weight="700">Sistemas Inteligentes</text>
      <text x="24" y="222" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace">08:50 – 10:35 · Lab G-402</text>

      <rect x="0" y="250" width="220" height="62" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <rect x="10" y="262" width="4" height="38" rx="2" fill="#60a5fa"/>
      <text x="24" y="276" fill="#f8fafc" font-size="13" font-weight="700">Base de Datos II</text>
      <text x="24" y="294" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace">11:30 – 13:15 · Aula H-205</text>

      <rect x="0" y="322" width="220" height="62" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <rect x="10" y="334" width="4" height="38" rx="2" fill="#34d399"/>
      <text x="24" y="348" fill="#f8fafc" font-size="13" font-weight="700">Ingeniería Web</text>
      <text x="24" y="366" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace">15:10 – 16:55 · Lab G-301</text>

      <!-- Bottom Nav Bar -->
      <rect x="0" y="402" width="220" height="40" rx="14" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="36" cy="422" r="5" fill="#38bdf8"/>
      <circle cx="88" cy="422" r="4" fill="#475569"/>
      <circle cx="136" cy="422" r="4" fill="#475569"/>
      <circle cx="184" cy="422" r="4" fill="#475569"/>
    </g>
  </g>
