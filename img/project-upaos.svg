      <text x="14" y="76" fill="#38bdf8" font-size="11" font-family="'JetBrains Mono', monospace">Entrega · Hoy 23:59</text>

      <rect x="0" y="106" width="228" height="62" rx="12" fill="#111c33" stroke="#1e293b"/>
      <text x="14" y="130" fill="#f8fafc" font-size="13" font-weight="700">Inteligencia Artificial</text>
      <text x="14" y="150" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace">Lab 04 · Mañana</text>

