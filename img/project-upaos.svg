    <text x="58" y="162" fill="#f8fafc" font-size="46" font-weight="800" letter-spacing="-1.2">UPAO S</text>
    <text x="58" y="198" fill="#94a3b8" font-size="18" font-weight="500">Tu vida universitaria, en tu celular</text>

    <!-- Feature summary cards on left -->
    <g transform="translate(58, 240)">
      <rect width="340" height="72" rx="14" fill="#0f172a" fill-opacity="0.88" stroke="#38bdf8" stroke-opacity="0.22"/>
      <rect x="16" y="18" width="36" height="36" rx="10" fill="#38bdf8" fill-opacity="0.14"/>
      <path d="M26 36h16M26 30h10M26 42h12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <text x="66" y="33" fill="#f1f5f9" font-size="14" font-weight="700">Notas &amp; Promedio Ponderado</text>
      <text x="66" y="53" fill="#94a3b8" font-size="12">Simulador en tiempo real por curso</text>
    </g>

    <g transform="translate(58, 326)">
      <rect width="340" height="72" rx="14" fill="#0f172a" fill-opacity="0.88" stroke="#38bdf8" stroke-opacity="0.16"/>
      <rect x="16" y="18" width="36" height="36" rx="10" fill="#60a5fa" fill-opacity="0.14"/>
      <rect x="25" y="27" width="18" height="18" rx="4" fill="none" stroke="#60a5fa" stroke-width="2"/>
      <path d="M25 33h18M31 24v5M37 24v5" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
      <text x="66" y="33" fill="#f1f5f9" font-size="14" font-weight="700">Horario &amp; Asistencias</text>
      <text x="66" y="53" fill="#94a3b8" font-size="12">Alertas inteligentes y control de faltas</text>
    </g>

    <g transform="translate(58, 412)">
      <rect width="340" height="72" rx="14" fill="#0f172a" fill-opacity="0.88" stroke="#38bdf8" stroke-opacity="0.16"/>
      <rect x="16" y="18" width="36" height="36" rx="10" fill="#34d399" fill-opacity="0.14"/>
      <circle cx="34" cy="36" r="8" fill="none" stroke="#34d399" stroke-width="2"/>
      <path d="M31 36l2 2 4-4" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="66" y="33" fill="#f1f5f9" font-size="14" font-weight="700">Integración Canvas LMS</text>
      <text x="66" y="53" fill="#94a3b8" font-size="12">Sincronización con WorkManager</text>
    </g>

    <text x="58" y="532" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">Jetpack Compose · Material 3 · Retrofit</text>
