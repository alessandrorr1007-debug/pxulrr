      <text x="58" y="288" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="'JetBrains Mono', monospace">94%</text>
      <text x="112" y="274" fill="#f8fafc" font-size="14" font-weight="700">Estado Óptimo</text>
      <text x="112" y="294" fill="#94a3b8" font-size="11">0 cursos en riesgo</text>
      <text x="112" y="312" fill="#34d399" font-size="11" font-weight="600">Sincronizado</text>
