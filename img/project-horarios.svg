    <circle cx="26" cy="27" r="5" fill="#475569"/>
    <circle cx="44" cy="27" r="5" fill="#475569"/>
    <circle cx="62" cy="27" r="5" fill="#475569"/>
    <text x="90" y="31" fill="#e2e8f0" font-size="13" font-weight="700">Armador de Horarios UPAO</text>
