<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Armador de Horarios UPAO — Generador de horarios sin cruces">
  <defs>
    <linearGradient id="bg-horarios" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="50%" stop-color="#0b1326"/>
      <stop offset="100%" stop-color="#11182d"/>
    </linearGradient>
    <radialGradient id="glow-horarios" cx="0.25" cy="0.2" r="0.65">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-horarios" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#60a5fa" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="600" fill="url(#bg-horarios)"/>
  <rect width="960" height="600" fill="url(#grid-horarios)"/>
  <rect width="960" height="600" fill="url(#glow-horarios)"/>

  <!-- Application Window -->
  <g transform="translate(46, 38)" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif">
    <rect width="868" height="524" rx="18" fill="#091020" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="1.2"/>

    <!-- Window Top Bar -->
